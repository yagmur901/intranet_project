{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 sm:p-8">
        <div class="flex items-center justify-between mb-6 border-b border-gray-100 pb-4">
            <div class="flex items-center gap-3">
                <div class="h-10 w-10 bg-amber-100 text-amber-600 rounded-lg flex items-center justify-center text-lg">
                    <i class="fa-solid fa-pen-to-square"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold text-gray-900">Etkinliği Düzenle</h1>
                    <p class="text-xs text-gray-500 mt-1">{{ event.title }}</p>
                </div>
            </div>
            
            <!-- Silme Butonu -->
            <form action="{% url 'event_delete' event.id %}" method="POST" onsubmit="return confirm('Bu etkinliği tamamen silmek istediğinize emin misiniz?');">
                {% csrf_token %}
                <button type="submit" class="text-red-500 hover:text-red-700 hover:bg-red-50 px-3 py-1.5 rounded transition text-sm font-bold flex items-center gap-2">
                    <i class="fa-regular fa-trash-can"></i> Sil
                </button>
            </form>
        </div>

        <form method="POST" class="space-y-5">
            {% csrf_token %}
            
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Etkinlik Başlığı <span class="text-red-500">*</span></label>
                <input type="text" name="title" value="{{ event.title }}" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 outline-none">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Başlangıç <span class="text-red-500">*</span></label>
                    <input type="datetime-local" name="start_date" value="{{ event.start_date|date:'Y-m-d\TH:i' }}" required
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Bitiş <span class="text-gray-400 font-normal text-xs">(İsteğe bağlı)</span></label>
                    <input type="datetime-local" name="end_date" value="{{ event.end_date|date:'Y-m-d\TH:i' }}"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 outline-none">
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Konum veya Bağlantı Linki</label>
                <input type="text" name="location" value="{{ event.location|default:'' }}"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Açıklama</label>
                <textarea name="description" rows="3"
                          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 outline-none">{{ event.description|default:'' }}</textarea>
            </div>

            {% if request.user.is_superuser %}
            <div class="p-4 bg-red-50 border border-red-200 rounded-lg mt-2">
                <label class="flex items-center gap-3 cursor-pointer">
                    <input type="checkbox" name="is_corporate" {% if event.is_corporate %}checked{% endif %} class="w-5 h-5 text-red-600 border-gray-300 rounded focus:ring-red-500">
                    <div class="flex flex-col">
                        <span class="text-sm font-bold text-red-900">Kurumsal Etkinlik Olarak İşaretle</span>
                    </div>
                </label>
            </div>
            {% endif %}

            <div class="flex items-center justify-end gap-3 pt-4 border-t border-gray-100 mt-6">
                <a href="{% url 'event_calendar' %}?date={{ event.start_date|date:'Y-m-d' }}" class="px-5 py-2.5 text-sm font-bold text-gray-600 hover:bg-gray-100 rounded-lg transition">İptal</a>
                <button type="submit" class="px-5 py-2.5 text-sm font-bold bg-amber-500 hover:bg-amber-600 text-white rounded-lg transition shadow-sm">
                    Değişiklikleri Kaydet
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
