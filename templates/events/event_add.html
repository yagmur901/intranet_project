{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 sm:p-8">
        <div class="flex items-center gap-3 mb-6 border-b border-gray-100 pb-4">
            <div class="h-10 w-10 bg-red-100 text-red-600 rounded-lg flex items-center justify-center text-lg">
                <i class="fa-regular fa-calendar-plus"></i>
            </div>
            <div>
                <h1 class="text-xl font-extrabold text-gray-900">Yeni Etkinlik Ekle</h1>
                <p class="text-xs text-gray-500 mt-1">Takviminize kişisel bir plan veya not ekleyin.</p>
            </div>
        </div>

        <form method="POST" action="{% url 'event_add' %}" class="space-y-5">
            {% csrf_token %}
            
            <!-- Etkinlik Başlığı -->
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1" for="title">Etkinlik Başlığı <span class="text-red-500">*</span></label>
                <input type="text" name="title" id="title" required placeholder="Örn: Yıllık İzin, Proje Toplantısı..."
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500 transition outline-none">
            </div>

            <!-- Tarihler -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1" for="start_date">Başlangıç Tarihi ve Saati <span class="text-red-500">*</span></label>
                    <input type="datetime-local" name="start_date" id="start_date" required
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500 transition outline-none">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1" for="end_date">Bitiş Tarihi ve Saati <span class="text-gray-400 font-normal text-xs">(İsteğe bağlı)</span></label>
                    <input type="datetime-local" name="end_date" id="end_date"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500 transition outline-none">
                </div>
            </div>

            <!-- Konum / Açıklama -->
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1" for="location">Konum veya Bağlantı Linki</label>
                <input type="text" name="location" id="location" placeholder="Örn: Toplantı Odası 2, Zoom Linki..."
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500 transition outline-none">
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1" for="description">Açıklama veya Notlar</label>
                <textarea name="description" id="description" rows="3" placeholder="Etkinlikle ilgili detaylar..."
                          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500 transition outline-none"></textarea>
            </div>

            <!-- Admin ise Kurumsal Etkinlik seçeneği çıksın -->
            {% if request.user.is_superuser %}
            <div class="p-4 bg-red-50 border border-red-200 rounded-lg mt-2">
                <label class="flex items-center gap-3 cursor-pointer">
                    <input type="checkbox" name="is_corporate" class="w-5 h-5 text-red-600 border-gray-300 rounded focus:ring-red-500">
                    <div class="flex flex-col">
                        <span class="text-sm font-bold text-red-900">Kurumsal Etkinlik Olarak Kaydet</span>
                        <span class="text-xs text-red-700">İşaretlerseniz bu etkinlik tüm şirket çalışanlarının takviminde görünür. İşaretlemezseniz sadece size özel olur.</span>
                    </div>
                </label>
            </div>
            {% else %}
                <p class="text-xs text-gray-500 flex items-center gap-1.5"><i class="fa-solid fa-lock text-gray-400"></i> Bu etkinlik sadece sizin takviminizde (Kişisel Etkinlik) görünür.</p>
            {% endif %}

            <!-- Butonlar -->
            <div class="flex items-center justify-end gap-3 pt-4 border-t border-gray-100 mt-6">
                <a href="{% url 'event_calendar' %}" class="px-5 py-2.5 text-sm font-bold text-gray-600 hover:bg-gray-100 rounded-lg transition">İptal</a>
                <button type="submit" class="px-5 py-2.5 text-sm font-bold bg-red-600 hover:bg-red-700 text-white rounded-lg transition shadow-sm">
                    Etkinliği Kaydet
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
