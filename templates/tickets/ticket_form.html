{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-xl shadow-md p-6 sm:p-8 border border-gray-100">
    <div class="mb-6 border-b border-gray-100 pb-4">
        <h2 class="text-2xl font-bold text-gray-800">Yeni Destek Talebi</h2>
        <p class="text-sm text-gray-500 mt-1">Lütfen yaşadığınız sorunu detaylıca açıklayın. IT birimi en kısa sürede ilgilenecektir.</p>
    </div>

    <form method="POST" class="space-y-5">
        {% csrf_token %}
        
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1.5">Sorun Başlığı</label>
            {{ form.title }}
        </div>

        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1.5">Öncelik Durumu</label>
            {{ form.priority }}
        </div>

        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1.5">Sorun Detayı</label>
            {{ form.description }}
        </div>

        <div class="pt-4 flex items-center justify-end gap-3 border-t border-gray-100">
            <a href="{% url 'ticket_list' %}" class="px-4 py-2 text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg text-sm font-semibold transition">
                İptal Et
            </a>
            <button type="submit" class="px-5 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-sm font-bold shadow-sm transition">
                Talebi Gönder
            </button>
        </div>
    </form>
</div>
{% endblock %}
